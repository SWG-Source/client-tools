# Settings for the 64-bit client. SwgClient_x64.bat loads this after the
# normal client.cfg, so all your usual settings still apply.
#
# Sound and movies run through the 32-bit helper. The paths are relative to
# the SWG Source client folder.

[ClientAudio]
	devMilesHost=x64\helper-x86\miles-host.exe
	devMilesDll=x64\helper-x86\Mss32.dll
	# Bytes the helper may hold for sound data (256 MiB, as in the tested runs).
	devMilesUploadBudget=268435456
